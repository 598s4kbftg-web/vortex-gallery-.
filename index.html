<head>

  <title>VORTEX GALLERY — Official Underground Rap Collective</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Syne:wght@700;800&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #050508;
      color: #e2e8f0;
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
    }
    h1, h2, h3, .font-syne { font-family: 'Syne', sans-serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    
    /* Custom Neon Glow Effect */
    .glow-purple { text-shadow: 0 0 20px rgba(168, 85, 247, 0.6), 0 0 40px rgba(168, 85, 247, 0.3); }
    .glow-box { box-shadow: 0 0 25px -5px rgba(168, 85, 247, 0.3); }
    .glow-box:hover { box-shadow: 0 0 35px 0px rgba(168, 85, 247, 0.6); }

    /* Glassmorphism Styling */
    .glass-card {
      background: rgba(18, 18, 26, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Custom Audio Progress Bar */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 12px;
      width: 12px;
      border-radius: 50%;
      background: #a855f7;
      cursor: pointer;
      box-shadow: 0 0 10px #a855f7;
    }
  </style>
</head>
